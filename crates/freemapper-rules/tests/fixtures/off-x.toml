# An overlay of base-x that switches a base rule off.
format = 1

[profile]
id = "off-x"
kind = "overlay"
base = "base-x"
name = { en = "Switch off" }

[sources.REG]
title = "Regional rules"

[[rules]]
id = "basex.code.range"
key = "code_range"
severity = "error"
enabled = false
values = { range = [31, 599] }
source = { doc = "REG", section = "§ 6" }
