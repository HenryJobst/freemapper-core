name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Actions pinned to commits; the comment names the release.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Cargo refuses a workspace without members; the Rust steps start with the first crate.
      - id: crates
        shell: bash
        run: if ls crates/*/Cargo.toml >/dev/null 2>&1; then echo "any=true" >> "$GITHUB_OUTPUT"; fi
      # Installs the toolchain and components named in rust-toolchain.toml.
      - if: steps.crates.outputs.any == 'true'
        run: rustup toolchain install
      - if: steps.crates.outputs.any == 'true'
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - if: steps.crates.outputs.any == 'true'
        run: cargo fmt --all --check
      - if: steps.crates.outputs.any == 'true'
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - if: steps.crates.outputs.any == 'true'
        run: cargo test --locked --workspace --all-features
      # The shared types of the contract crate must build and pass without the map reader.
      - if: steps.crates.outputs.any == 'true'
        run: cargo test --locked -p freemapper-contract --no-default-features
