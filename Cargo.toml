[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.15.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-core"
rust-version = "1.88"

[workspace.dependencies]
freemapper-text = { path = "crates/freemapper-text" }
freemapper-rules = { path = "crates/freemapper-rules" }
freemapper-omap = { path = "crates/freemapper-omap" }
freemapper-course = { path = "crates/freemapper-course" }
freemapper-georef = { path = "crates/freemapper-georef" }
freemapper-contract = { path = "crates/freemapper-contract" }
freemapper-render = { path = "crates/freemapper-render" }
freemapper-web = { path = "crates/freemapper-web" }
# Pinned to the versions in freemapper-courseplan's Cargo.lock. Fluent catalogs for program texts.
fluent-bundle = "=0.16.0"
fluent-syntax = "=0.12.0"
unic-langid = "=0.9.6"
# Pinned to the versions in freemapper-courseplan's Cargo.lock. Rule profiles.
thiserror = "=2.0.21"
toml = "=1.2.1"
# Pinned to the version in freemapper's Cargo.lock. Windows file identity (volume serial number
# and file index) without unsafe code of our own.
same-file = "=1.0.6"
# Pinned to the version in freemapper-print's Cargo.lock. The .omap and course readers.
quick-xml = "=0.42.0"
# Pinned to the version in freemapper-print's Cargo.lock. Number placements and the y axis in project files.
serde = { version = "=1.0.229", features = ["derive"] }
# Pinned to the versions in freemapper-print's Cargo.lock. The renderer: PDF writer, deflate, raster images,
# font subsetting and metrics.
image = { version = "=0.25.10", default-features = false, features = ["jpeg", "png"] }
miniz_oxide = "=0.9.1"
pdf-writer = "=0.15.0"
subsetter = { version = "=0.2.6", default-features = false }
ttf-parser = { version = "=0.25.1", default-features = false, features = ["std"] }
# Same versions as freemapper's Cargo.lock. The local web page shell: HTTP server, embedded assets, token.
axum = { version = "=0.8.9", default-features = false }
getrandom = "=0.4.3"
rust-embed = { version = "=8.13.0", default-features = false }
tokio = { version = "=1.54.1", default-features = false }
# Pinned to the version in freemapper's Cargo.lock. The update manifest.
serde_json = "=1.0.154"
# Version 0.3.0 was released 2026-09-25, 47 days before 2026-11-11, so the two-week rule of ADR 0012 holds.
# The minisign check of the update manifest; no dependencies of its own.
minisign-verify = "=0.3.0"
# Test only: temporary folders.
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
