[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
repository = "https://github.com/HenryJobst/freemapper-core"
rust-version = "1.88"

[workspace.dependencies]
# Pinned to the version in freemapper's Cargo.lock. Windows file identity (volume serial number
# and file index) without unsafe code of our own.
same-file = "=1.0.6"
# Test only: temporary folders.
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
